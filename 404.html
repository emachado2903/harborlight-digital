<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Harborlight Digital</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('hl-theme'); } catch (e) {}
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <style>
    .lost { min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 40px 20px; }
    .lost img, .lost svg { width: 72px; height: auto; margin: 0 auto 28px; }
    .lost p { margin-top: 16px; color: var(--ink-soft); }
    .lost .btn { margin-top: 32px; }
  </style>
</head>
<body>
  <main class="lost">
    <div>
      <svg viewBox="0 0 40 49" aria-hidden="true"><path d="M20 1 L39 28 L20 48 L1 28 Z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 31c6-6 11-6 16 0s10 6 15 0M8 37c5-5 9-5 13 0s8 5 12 0" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      <h1 class="display">This page drifted off.</h1>
      <p>The link may be old, or the page may have moved.</p>
      <a class="btn btn-solid" href="/">Back to Harborlight Digital</a>
    </div>
  </main>
</body>
</html>
